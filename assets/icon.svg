<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="AWS Study Navigator app icon">
  <title>AWS Study Navigator</title>
  <!-- #247: single motif — a faceted compass star ("navigator" north star). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a52"/>
      <stop offset="1" stop-color="#111a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9900" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="196" fill="url(#glow)"/>
  <g id="star">
    <!-- Lit facets (light from top-left) -->
    <path fill="#ffc266" d="M256 256L256 64L218 218ZM256 256L88 256L218 218ZM256 256L424 256L294 218ZM256 256L256 448L218 294Z"/>
    <!-- Shaded facets -->
    <path fill="#ff9900" d="M256 256L256 64L294 218ZM256 256L424 256L294 294ZM256 256L256 448L294 294ZM256 256L88 256L218 294Z"/>
  </g>
</svg>
